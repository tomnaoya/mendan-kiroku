services:
  - type: web
    name: mendan-kiroku
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mendan-kiroku-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_ID
        value: admin
      - key: ADMIN_PW
        value: admin

databases:
  - name: mendan-kiroku-db
    databaseName: mendan_kiroku
    user: mendan_kiroku
    plan: free
