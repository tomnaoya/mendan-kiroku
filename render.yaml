services:
  - type: web
    name: pulse-survey-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-survey-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_ID
        value: admin
      - key: ADMIN_PW
        value: admin

databases:
  - name: pulse-survey-db
    databaseName: pulse_survey
    user: pulse_survey
    plan: free
