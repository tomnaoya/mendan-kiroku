<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - 面談記録システム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
      color: white;
      border-radius: 16px 16px 0 0;
      padding: 32px;
      text-align: center;
    }
    .login-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
    .login-header p { opacity: 0.8; margin: 8px 0 0; font-size: 0.9rem; }
    .login-body { padding: 32px; }
    .form-label { font-weight: 600; color: #374151; font-size: 0.9rem; }
    .btn-login {
      background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
    }
    .btn-login:hover { opacity: 0.9; color: white; }
  </style>
</head>
<body>
  <div class="login-card card">
    <div class="login-header">
      <i class="bi bi-clipboard2-pulse" style="font-size: 2.5rem;"></i>
      <h1 class="mt-2">面談記録システム</h1>
      <p>パルスサーベイ管理ポータル</p>
    </div>
    <div class="login-body">
      {% if error %}
      <div class="alert alert-danger alert-sm mb-3 py-2" style="font-size:0.9rem;">
        <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
      </div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">ユーザーID</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">パスワード</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" placeholder="••••••" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>ログイン
        </button>
      </form>
    </div>
  </div>
</body>
</html>
