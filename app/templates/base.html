<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}面談記録システム{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .navbar { background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .navbar-brand { font-weight: 700; letter-spacing: 0.05em; }
    .nav-link-menu { color: rgba(255,255,255,0.85) !important; font-size: 0.9rem; padding: 6px 14px; border-radius: 6px; transition: background 0.15s; }
    .nav-link-menu:hover, .nav-link-menu.active { background: rgba(255,255,255,0.15); color: #fff !important; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .card-header { border-radius: 12px 12px 0 0 !important; }
    .badge-score { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; }
    .score-1, .score-2 { background: #f8d7da; color: #842029; }
    .score-3 { background: #fff3cd; color: #664d03; }
    .score-4, .score-5 { background: #d1e7dd; color: #0f5132; }
    .score-none { background: #e9ecef; color: #6c757d; }
    .alert-row { background: #fff5f5 !important; }
    .caution-row { background: #fffdf0 !important; }
    .dept-badge { font-size: 0.75rem; background: #e8f0fe; color: #1a56db; border-radius: 20px; padding: 2px 10px; }
    .interview-done { color: #198754; }
    .form-section { background: #f8f9ff; border-left: 4px solid #2d6a9f; padding: 16px 20px; border-radius: 0 8px 8px 0; margin-bottom: 16px; }
    .form-section h6 { color: #1a3a5c; font-weight: 700; margin-bottom: 12px; }
    .month-tab { cursor: pointer; }
    .month-tab.active { background: #2d6a9f; color: white; }
    /* ソートアイコン */
    .sort-link { color: inherit; text-decoration: none; white-space: nowrap; }
    .sort-link:hover { color: #2d6a9f; }
    .sort-icon { font-size: 0.75rem; opacity: 0.5; }
    .sort-icon.active { opacity: 1; color: #2d6a9f; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block navbar %}
  <nav class="navbar navbar-dark px-4 py-3 mb-4">
    <a class="navbar-brand" href="/staff">
      <i class="bi bi-clipboard2-pulse me-2"></i>面談記録システム
    </a>
    <div class="d-flex align-items-center gap-2">
      <a href="/staff" class="nav-link-menu {% if request.url.path == '/staff' %}active{% endif %}">
        <i class="bi bi-people me-1"></i>スタッフ一覧
      </a>
      <a href="/trends" class="nav-link-menu {% if request.url.path == '/trends' %}active{% endif %}">
        <i class="bi bi-graph-up-arrow me-1"></i>傾向分析
      </a>
      <a href="/logout" class="btn btn-outline-light btn-sm ms-3">
        <i class="bi bi-box-arrow-right me-1"></i>ログアウト
      </a>
    </div>
  </nav>
  {% endblock %}

  <div class="container-xl pb-5">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
